<div class="container">
    
<div class="form">

    <div>
    <h1>Bookdepo</h1>
    <h2>Login to your account</h2>
    </div>
    <div>
    <label>Email</label>
    <input type="email" placeholder="enter your email address" [(ngModel)]="email">
    <br>
    <br>
    <label>Password:</label>
    <input type="password" placeholder="enter your password" [(ngModel)]="password">
    <br>
    <br>
   <button (click)="onLogin()">Login</button>
   <div>
    <a href="/">Does not have an account?</a>
</div>
</div>
</div>
</div>
